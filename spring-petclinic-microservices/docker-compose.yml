services:
  config-server:
    image: springcommunity/spring-petclinic-config-server
    pull_policy: never  # built from this repo's source: make build
    container_name: config-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
     - 8888:8888

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    pull_policy: never  # built from this repo's source: make build
    container_name: discovery-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
    ports:
     - 8761:8761

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    pull_policy: never  # built from this repo's source: make build
    container_name: customers-service
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
    - 8081:8081

  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    pull_policy: never  # built from this repo's source: make build
    container_name: visits-service
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 8082:8082

  vets-service:
    image: springcommunity/spring-petclinic-vets-service
    pull_policy: never  # built from this repo's source: make build
    container_name: vets-service
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 8083:8083


  genai-service:
    image: springcommunity/spring-petclinic-genai-service
    pull_policy: never  # built from this repo's source: make build
    container_name: genai-service
    profiles:
      - genai
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 8084:8084


  api-gateway:
    image: springcommunity/spring-petclinic-api-gateway
    pull_policy: never  # built from this repo's source: make build
    container_name: api-gateway
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 8080:8080

  # Our own tooling (tracing, monitoring) restarts on failure; the app
  # under test deliberately does not, so the chaos experiments can show it.
  tracing-server:
    image: openzipkin/zipkin:3.6.1
    container_name: tracing-server
    restart: unless-stopped
    environment:
      # In-memory storage is unbounded by default and ran out of heap after ~30 min.
      MEM_MAX_SPANS: "30000"
      JAVA_OPTS: "-Xms128m -Xmx320m -XX:+ExitOnOutOfMemoryError"
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 9411:9411

  admin-server:
    image: springcommunity/spring-petclinic-admin-server
    pull_policy: never  # built from this repo's source: make build
    container_name: admin-server
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 9090:9090

  ## Grafana / Prometheus

  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 3030:3000

  # Optional: start with `--profile cadvisor`. Per-container metrics need Docker
  # Desktop's classic image store (Settings > General > "Use containerd for
  # pulling and storing images" OFF); with the default containerd store cAdvisor
  # runs but cannot read any container. See docs/container-resource-monitoring.md.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    profiles:
      - cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker=unix:///tmp/docker.sock
      - --docker_only=true
      - --housekeeping_interval=5s
      - --disable_metrics=disk
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      # Mounted outside /var/run: newer Docker engines refuse to mount the
      # socket inside a read-only /var/run.
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - 127.0.0.1:8085:8080

  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    restart: unless-stopped
    depends_on:
      cadvisor:
        condition: service_started
        required: false  # cAdvisor is optional
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 9091:9090

